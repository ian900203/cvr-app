<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>CVR Apps</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", Arial, sans-serif;
      background: #0f1420; color: #eef2f8; line-height: 1.6;
    }
    main { padding: 44px 24px; max-width: 560px; text-align: center; }
    h1 { font-size: clamp(30px, 8vw, 46px); margin: 0 0 10px; letter-spacing: .5px; }
    .status { display: inline-flex; align-items: center; gap: 8px; color: #9aa7bd; font-size: 14px; margin-bottom: 18px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 0 4px rgba(46,204,113,.15); }
    p { color: #9aa7bd; margin: 6px 0; font-size: 15px; }
    code { background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>CVR Apps</h1>
    <div class="status"><span class="dot"></span> Internal web workspace · <code>app.cvrgroup.co</code></div>
    <p>Private staging space for tools, dashboards, forms and event pages.</p>
    <p>Access is by direct link only.</p>
  </main>
</body>
</html>
